        :root {
            --blkstr-space-grey: #111316;

            --blkstr-black: #000000;
            --blkstr-white: #ffffff;
            --blkstr-border: #2d333b;

        }
        body {
            min-height: 100vh;

            color: var(--blkstr-white);

        .navbar-brand {

        }
        .card {
            background: var(--blkstr-space-grey);
            border: 1px solid var(--blkstr-border);
            border-radius: 6px;
        }
        .card-header {
            background: transparent;
            border-bottom: 1px solid var(--blkstr-border);
            font-weight: 600;
            padding: 0.75rem 1rem;
            color: var(--blkstr-white);
        }
        .form-select {
            background-color: var(--blkstr-black);
            border: 1px solid var(--blkstr-border);
            color: var(--blkstr-white);
        }
        .form-select:focus {
            border-color: var(--blkstr-blue);
            box-shadow: 0 0 0 0.2rem rgba(0, 195, 255, 0.25);
        }
        .btn-jade {
            background: var(--blkstr-blue);
            border-color: var(--blkstr-blue);
            color: var(--blkstr-black);
        }
        .btn-jade:hover {
            background: #33ceff;
            border-color: #33ceff;
            color: var(--blkstr-black);
        }
        .btn-outline-jade {
            border-color: var(--blkstr-blue);
            color: var(--blkstr-blue);
        }
        .btn-outline-jade:hover {
            background: rgba(0, 195, 255, 0.15);
            border-color: var(--blkstr-blue);
            color: var(--blkstr-blue);
        }
        .progress {
            height: 4px;
            background-color: var(--blkstr-black);
            border-radius: 0;
        }
        .progress-bar {
            background: var(--blkstr-blue);
        }
        .alert-warning-custom {
            background: rgba(210, 153, 34, 0.1);
            border: 1px solid rgba(210, 153, 34, 0.4);
            color: #d4a94b;
        }
        .text-muted {
            color: var(--blkstr-muted) !important;
        }
        .firmware-card .form-select {
            font-size: 0.875rem;
        }
        #success {
            font-weight: 600;
            color: var(--blkstr-blue);
        }
